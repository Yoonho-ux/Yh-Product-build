<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>제가 잘못한건가요? — 판결 피드</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#FBFBF8;
    --page:#E7E5DE;
    --surface:#FFFFFF;
    --ink:#16150F;
    --ink-2:#6E6C63;
    --ink-3:#A6A49A;
    --line:#ECEAE2;
    --line-2:#E0DDD3;
    --tint:#F4F3EE;

    --poster:#C75D4E;   /* 글쓴이 잘못 */
    --other:#3E6FA3;    /* 상대가 잘못 */
    --both:#B8893C;     /* 둘 다 잘못 */

    --serif:'Gowun Batang', serif;
    --sans:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --pad:22px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--page);
    color:var(--ink);
    display:flex;
    justify-content:center;
    overflow:hidden;
    letter-spacing:-0.01em;
  }

  /* ---- phone frame ---- */
  .app{
    position:relative;
    width:min(480px,100%);
    height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (min-width:540px){
    body{padding:26px 0;}
    .app{
      height:min(896px, calc(100dvh - 52px));
      border-radius:30px;
      box-shadow:0 30px 70px -20px rgba(30,28,20,.35), 0 0 0 1px rgba(0,0,0,.04);
      overflow:hidden;
    }
  }

  /* ---- top bar ---- */
  .topbar{
    flex:0 0 auto;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    background:rgba(251,251,248,.82);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
  }
  .brand{
    font-size:16px;
    font-weight:700;
    letter-spacing:-0.03em;
    display:flex;align-items:center;gap:6px;
  }
  .brand .scale{font-size:15px; filter:grayscale(.15);}

  /* ---- feed ---- */
  .feed{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y proximity;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .feed::-webkit-scrollbar{width:0;}

  /* ---- card ---- */
  .card{
    scroll-snap-align:start;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:26px var(--pad) 0;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .card-head{display:flex;align-items:center;gap:9px;margin-bottom:18px;}
  .cat{
    font-size:12.5px;font-weight:600;color:var(--ink-2);
    background:var(--tint);
    padding:5px 11px;border-radius:999px;
    letter-spacing:0;
  }
  .agenda-no{font-size:12.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums;}

  .title{
    font-size:23px;font-weight:700;line-height:1.32;
    letter-spacing:-0.025em;margin:0 0 16px;
  }
  .body{
    font-size:16.5px;line-height:1.68;color:#2E2C24;
    white-space:pre-wrap;margin:0 0 22px;font-weight:400;
  }

  .teaser{
    display:flex;align-items:center;gap:7px;
    font-size:13px;color:var(--ink-3);margin-bottom:18px;font-weight:500;
  }
  .teaser .pulse{width:6px;height:6px;border-radius:50%;background:var(--poster);
    box-shadow:0 0 0 0 rgba(199,93,78,.5);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(199,93,78,.45);}70%{box-shadow:0 0 0 7px rgba(199,93,78,0);}100%{box-shadow:0 0 0 0 rgba(199,93,78,0);}}

  /* ---- vote buttons ---- */
  .votes{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .vote{
    display:flex;align-items:center;gap:12px;
    width:100%;padding:16px 18px;
    background:var(--surface);
    border:1.5px solid var(--line-2);
    border-radius:15px;
    font-family:var(--sans);
    font-size:16px;font-weight:600;color:var(--ink);
    cursor:pointer;text-align:left;
    transition:border-color .18s, background .18s, transform .12s;
  }
  .vote .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .vote[data-k="poster"] .dot{background:var(--poster);}
  .vote[data-k="other"]  .dot{background:var(--other);}
  .vote[data-k="both"]   .dot{background:var(--both);}
  .vote .arrow{margin-left:auto;color:var(--ink-3);font-size:18px;transition:transform .18s, color .18s;}
  .vote:hover{border-color:#CFCCC0;}
  .vote:active{transform:scale(.985);}
  .vote:hover .arrow{transform:translateX(3px);color:var(--ink-2);}

  .swipe-hint{
    margin-top:auto;padding:20px 0 26px;
    text-align:center;color:var(--ink-3);font-size:12.5px;font-weight:500;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .swipe-hint .chev{font-size:15px;animation:floaty 1.8s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);opacity:.6;}50%{transform:translateY(-4px);opacity:1;}}

  /* ---- result (revealed after vote) ---- */
  .result{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .5s cubic-bezier(.22,1,.36,1), opacity .4s ease;
  }
  .card.voted .result{max-height:2000px;opacity:1;}
  .card.voted .votes{display:none;}
  .card.voted .swipe-hint{display:none;}
  .card.voted .teaser{display:none;}

  .verdict{
    border-top:1px solid var(--line);
    padding-top:22px;margin-bottom:6px;
  }
  .verdict-label{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:0.02em;margin-bottom:5px;}
  .verdict-line{
    font-family:var(--serif);
    font-size:21px;font-weight:700;line-height:1.4;letter-spacing:-0.01em;
  }
  .verdict-line b{color:var(--poster);}
  .verdict-line .cnt{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);margin-left:4px;}

  .bars{margin:22px 0 6px;display:flex;flex-direction:column;gap:15px;}
  .bar-row{}
  .bar-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;}
  .bar-name{font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .bar-name .mine{
    font-size:10.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:2px 6px;border-radius:5px;letter-spacing:0;
  }
  .bar-pct{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .bar-pct .v{font-size:11px;font-weight:500;color:var(--ink-3);margin-left:5px;}
  .track{height:11px;border-radius:999px;background:var(--tint);overflow:hidden;}
  .fill{height:100%;width:0;border-radius:999px;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .bar-row[data-k="poster"] .fill{background:var(--poster);}
  .bar-row[data-k="other"]  .fill{background:var(--other);}
  .bar-row[data-k="both"]   .fill{background:var(--both);}
  .bar-row.dim{opacity:.5;}

  .share-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin:20px 0 4px;padding:13px;
    background:var(--surface);border:1.5px solid var(--line-2);border-radius:13px;
    font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .share-btn:hover{background:var(--tint);border-color:#CFCCC0;}

  /* ---- comments ---- */
  .comments{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;padding-bottom:28px;}
  .cmt-head{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:6px;}
  .cmt-head .n{color:var(--ink-3);font-weight:600;}
  .cmt{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  .cmt-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);}
  .cmt-nick{font-weight:700;color:var(--ink-2);}
  .cmt-text{font-size:14.5px;line-height:1.55;color:#2E2C24;}
  .cmt-like{font-size:12px;color:var(--ink-3);margin-top:1px;cursor:pointer;width:fit-content;user-select:none;}
  .cmt-like:hover{color:var(--poster);}

  .cmt-input{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .cmt-input input{
    flex:1;padding:12px 15px;border:1.5px solid var(--line-2);border-radius:12px;
    font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--surface);outline:none;
    transition:border-color .15s;
  }
  .cmt-input input:focus{border-color:#C0BCAE;}
  .cmt-send{
    flex:0 0 auto;padding:12px 16px;border:none;border-radius:12px;background:var(--ink);color:#fff;
    font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;
  }
  .cmt-send:active{opacity:.8;}

  /* ---- FAB ---- */
  .fab{
    position:absolute;right:18px;bottom:22px;z-index:40;
    width:56px;height:56px;border-radius:50%;border:none;
    background:var(--ink);color:#fff;font-size:28px;font-weight:300;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -6px rgba(22,21,15,.5);
    transition:bottom .35s cubic-bezier(.22,1,.36,1), transform .15s;
  }
  .fab:active{transform:scale(.92);}
  .fab.shifted{bottom:88px;}
  .fab-top{
    position:absolute;right:18px;bottom:22px;z-index:40;
    width:56px;height:56px;border-radius:50%;border:none;
    background:var(--surface);color:var(--ink);font-size:22px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px -4px rgba(22,21,15,.25);
    border:1.5px solid var(--line-2);
    transform:translateY(80px);opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.22,1,.36,1), opacity .3s ease;
  }
  .fab-top.visible{transform:translateY(0);opacity:1;pointer-events:auto;}
  .fab-top:active{transform:scale(.92);}

  /* ---- composer sheet ---- */
  .scrim{
    position:absolute;inset:0;z-index:50;background:rgba(20,19,12,.32);
    opacity:0;pointer-events:none;transition:opacity .28s;
  }
  .scrim.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:60;
    background:var(--bg);border-radius:24px 24px 0 0;
    padding:10px var(--pad) 26px;
    transform:translateY(110%);transition:transform .34s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -16px 40px -12px rgba(20,19,12,.3);
    max-height:90%;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:8px auto 18px;}
  .sheet h3{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:-0.02em;}
  .sheet .sub{margin:0 0 20px;font-size:13.5px;color:var(--ink-2);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px;}
  .field input[type=text], .field textarea{
    width:100%;border:1.5px solid var(--line-2);border-radius:13px;background:var(--surface);
    font-family:var(--sans);font-size:15.5px;color:var(--ink);padding:13px 15px;outline:none;
    transition:border-color .15s;resize:none;
  }
  .field input:focus,.field textarea:focus{border-color:#C0BCAE;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:9px 15px;border:1.5px solid var(--line-2);border-radius:999px;background:var(--surface);
    font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;
    transition:all .15s;
  }
  .chip.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .post-btn{
    width:100%;margin-top:8px;padding:16px;border:none;border-radius:15px;background:var(--ink);color:#fff;
    font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s;
  }
  .post-btn:disabled{opacity:.4;cursor:default;}

  /* toast */
  .toast{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 18px;border-radius:12px;z-index:70;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="brand"><span class="scale">⚖️</span>제가 잘못한건가요?</span>
  </header>

  <main class="feed" id="feed"></main>

  <button class="fab" id="fab" aria-label="안건 작성">+</button>
  <button class="fab-top" id="fab-top" aria-label="맨 위로">↑</button>

  <!-- composer -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <h3>새 안건 올리기</h3>
    <p class="sub">익명으로 올라가요. 사연 속 인물의 실명·신상은 적지 말아 주세요.</p>

    <div class="field">
      <label>제목</label>
      <input type="text" id="c-title" maxlength="40" placeholder="한 줄로 상황을 요약해 주세요" />
    </div>
    <div class="field">
      <label>상황</label>
      <textarea id="c-body" rows="5" maxlength="500" placeholder="무슨 일이 있었는지 배심원들이 판결할 수 있게 적어주세요"></textarea>
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="chips" id="c-chips">
        <button class="chip" data-cat="연애">연애</button>
        <button class="chip" data-cat="가족">가족</button>
        <button class="chip" data-cat="친구">친구</button>
        <button class="chip" data-cat="직장">직장</button>
        <button class="chip" data-cat="기타">기타</button>
      </div>
    </div>
    <button class="post-btn" id="post-btn" disabled>판결대에 올리기</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const OPTIONS = [
  {k:'poster', label:'글쓴이 잘못'},
  {k:'other',  label:'상대가 잘못'},
  {k:'both',   label:'둘 다 잘못'},
];

let agendas = [
  {
    id:13, cat:'연애', title:'남자친구가 전여친이랑 단둘이 밥 먹었어요',
    body:'남자친구가 "옛날 친구 만난다"고 나갔다가 나중에 전여친이랑 둘이 밥 먹은 게 밝혀졌어요. 숨긴 건 아니고 그냥 말 안 했대요. "그냥 오랜 친구"라는데, 왜 미리 말 안 했냐고 했더니 오히려 제가 질투하는 거냐며 화를 내요. 제가 예민한 건가요?',
    votes:{poster:389, other:3241, both:872},
    comments:[
      {nick:'연애상담8년차', text:'"그냥 친구면 왜 숨겨요" 이 논리는 아직도 유효합니다.', likes:1204},
      {nick:'현실주의자', text:'전 연인이랑 단둘이 밥 먹는 거 자체가 배려 없는 행동. 글쓴이 잘못 없음.', likes:731},
    ]
  },
  {
    id:12, cat:'직장', title:'퇴근 후 카톡 업무 지시를 읽씹했습니다',
    body:'밤 10시에 팀장님한테 "내일 아침 첫 보고 전까지 자료 정리해서 보내줘"라고 카톡이 왔어요. 저는 이미 퇴근했고 내일 출근해서 하면 된다고 생각해서 읽고 답장 안 했거든요. 다음날 팀장님이 "왜 답장 안 했냐"고 하시는데… 제가 잘못한 건가요?',
    votes:{poster:502, other:4187, both:634},
    comments:[
      {nick:'노동법공부중', text:'근로기준법상 퇴근 후는 개인 시간입니다. 카톡 답장 의무 없음.', likes:2341},
      {nick:'현실직장인', text:'법적으론 맞는데 현실에서 그걸 관철하려면 각오가 필요하죠…', likes:887},
    ]
  },
  {
    id:11, cat:'친구', title:'제 얼굴 나온 사진을 동의 없이 인스타에 올렸어요',
    body:'친구가 같이 찍은 사진을 제 동의 없이 인스타그램에 올렸어요. 저는 SNS 안 하고 얼굴 노출 싫어한다고 여러 번 말했는데, 친구는 "예쁘게 나왔는데 왜 그래, 민감하게 군다"고 해요. 삭제 요청했더니 이미 지인들한테 다 퍼진 후였고요.',
    votes:{poster:61, other:3892, both:204},
    comments:[
      {nick:'초상권지킴이', text:'초상권은 기본권입니다. 싫다고 했으면 그걸로 끝이에요.', likes:1876},
      {nick:'법학과졌어', text:'동의 없는 얼굴 사진 게시는 법적으로도 문제 될 수 있어요.', likes:943},
    ]
  },
  {
    id:10, cat:'연애', title:'사귀자마자 서로 폰 잠금번호 공유하자고 해요',
    body:'사귄 지 2주 된 남자친구가 "우리 서로 폰 비밀번호 알고 지내자, 그게 진짜 신뢰 아니냐"고 해요. 저는 숨기는 게 있어서가 아니라 개인 공간이 필요한 거라고 했더니 "그러면 뭔가 숨기는 거 아니냐"고 하네요. 제가 이상한 건가요?',
    votes:{poster:278, other:2954, both:519},
    comments:[
      {nick:'심리학전공', text:'사귄 지 2주에 폰 공유 요구는 집착의 초기 신호일 수 있어요.', likes:1532},
      {nick:'솔직한남자', text:'신뢰는 폰 비번으로 증명하는 게 아닌데… 이미 레드플래그.', likes:1021},
    ]
  },

const feed = document.getElementById('feed');
const nf = n => n.toLocaleString('ko-KR');

function cardHTML(a){
  const total = a.votes.poster + a.votes.other + a.votes.both;
  const teaser = total > 0
    ? `<span class="pulse"></span>지금까지 <b style="color:var(--ink-2);font-weight:700">${nf(total)}명</b>이 판결했어요`
    : `<span class="pulse"></span>아직 아무도 판결하지 않았어요. 첫 판결을 내려주세요`;

  const voteBtns = OPTIONS.map(o=>`
    <button class="vote" data-k="${o.k}">
      <span class="dot"></span>${o.label}
      <span class="arrow">→</span>
    </button>`).join('');

  const bars = OPTIONS.map(o=>`
    <div class="bar-row" data-k="${o.k}">
      <div class="bar-top">
        <span class="bar-name">${o.label}<span class="mine" hidden>나의 판결</span></span>
        <span class="bar-pct"><span class="p">0</span>%<span class="v">(<span class="c">0</span>표)</span></span>
      </div>
      <div class="track"><div class="fill"></div></div>
    </div>`).join('');

  const cmtList = a.comments.map((c,i)=>commentHTML(c,i)).join('');

  return `
  <article class="card" data-id="${a.id}">
    <div class="card-head">
      <span class="cat">${a.cat}</span>
      <span class="agenda-no">안건 #${String(a.id).padStart(3,'0')}</span>
    </div>
    <h2 class="title">${a.title}</h2>
    <p class="body">${a.body}</p>

    <div class="teaser">${teaser}</div>

    <div class="votes">${voteBtns}</div>

    <div class="swipe-hint"><span class="chev">↑</span>위로 밀어 다음 안건 보기</div>

    <div class="result">
      <div class="verdict">
        <div class="verdict-label">민심의 판결</div>
        <div class="verdict-line"></div>
      </div>
      <div class="bars">${bars}</div>
      <button class="share-btn">⚖️ 이 판결 결과 공유하기</button>

      <div class="comments">
        <div class="cmt-head">댓글 <span class="n">${a.comments.length}</span></div>
        <div class="cmt-list">${cmtList}</div>
        <div class="cmt-input">
          <input type="text" placeholder="배심원으로서 한마디 거들기…" maxlength="200" />
          <button class="cmt-send">등록</button>
        </div>
      </div>
    </div>
  </article>`;
}

function commentHTML(c){
  return `
    <div class="cmt">
      <div class="cmt-meta"><span class="cmt-nick">${c.nick}</span><span>·</span><span>방금</span></div>
      <div class="cmt-text">${c.text}</div>
      <div class="cmt-like" data-likes="${c.likes}">♡ ${nf(c.likes)}</div>
    </div>`;
}

function render(){
  feed.innerHTML = agendas.map(cardHTML).join('');
  feed.querySelectorAll('.card').forEach(bindCard);
}

function bindCard(card){
  const id = +card.dataset.id;
  const a = agendas.find(x=>x.id===id);

  // vote
  card.querySelectorAll('.vote').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.classList.contains('voted')) return;
      const k = btn.dataset.k;
      a.votes[k] += 1;
      revealResult(card, a, k);
    });
  });

  // share
  card.querySelector('.share-btn').addEventListener('click', ()=>{
    const win = winner(a);
    const bodyPreview = a.body.length > 60 ? a.body.slice(0, 60) + '…' : a.body;
    const shareText = `⚖️ 제가 잘못한건가요?\n\n"${a.title}"\n${bodyPreview}\n\n민심의 판결 → ${labelOf(win.k)} ${win.pct}%\n\n👉 직접 판결하러 가기: ${location.href}`;
    navigator.clipboard.writeText(shareText).then(()=>{
      toast('친구들이 볼 수 있게 링크를 복사했어요. 공유해보세요 :)');
    }).catch(()=>{
      toast('링크를 복사했어요. 공유해보세요 :)');
    });
  });

  // comments
  const input = card.querySelector('.cmt-input input');
  const send  = card.querySelector('.cmt-send');
  const list  = card.querySelector('.cmt-list');
  const headN = card.querySelector('.cmt-head .n');
  const submit = ()=>{
    const v = input.value.trim();
    if(!v) return;
    a.comments.push({nick:'익명의 배심원', text:v, likes:0});
    list.insertAdjacentHTML('beforeend', commentHTML({nick:'익명의 배심원', text:v, likes:0}));
    bindLikes(list);
    headN.textContent = a.comments.length;
    input.value='';
  };
  send.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });

  bindLikes(list);
}

function bindLikes(scope){
  scope.querySelectorAll('.cmt-like').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', ()=>{
      let n = +el.dataset.likes;
      if(el.dataset.liked){ n--; el.removeAttribute('data-liked'); el.style.color=''; }
      else { n++; el.dataset.liked='1'; el.style.color='var(--poster)'; }
      el.dataset.likes = n;
      el.innerHTML = `${el.dataset.liked?'♥':'♡'} ${nf(n)}`;
    });
  });
}

function total(a){ return a.votes.poster + a.votes.other + a.votes.both; }
function labelOf(k){ return OPTIONS.find(o=>o.k===k).label; }
function winner(a){
  const t = total(a);
  let best={k:'poster',c:-1};
  OPTIONS.forEach(o=>{ if(a.votes[o.k]>best.c) best={k:o.k,c:a.votes[o.k]}; });
  return {...best, pct: t? Math.round(best.c/t*100):0};
}

function revealResult(card, a, mine){
  const t = total(a);
  const win = winner(a);
  const wColor = `var(--${win.k})`;

  // verdict line
  const vline = card.querySelector('.verdict-line');
  vline.innerHTML = `<b style="color:${wColor}">${labelOf(win.k)}</b><span class="cnt">${nf(a.votes[win.k])}표 · ${win.pct}%</span>`;

  // bars
  card.querySelectorAll('.bar-row').forEach(row=>{
    const k = row.dataset.k;
    const c = a.votes[k];
    const pct = t? Math.round(c/t*100):0;
    if(k!==win.k) row.classList.add('dim');
    row.querySelector('.c').textContent = nf(c);
    if(k===mine) row.querySelector('.mine').hidden = false;
    // animate
    const fill = row.querySelector('.fill');
    const pEl = row.querySelector('.p');
    requestAnimationFrame(()=>{ setTimeout(()=>{ fill.style.width = pct+'%'; },50); });
    animateCount(pEl, pct, 800);
  });

  card.classList.add('voted');
  setTimeout(()=>{ card.querySelector('.verdict').scrollIntoView({behavior:'smooth', block:'nearest'}); }, 260);
}

function animateCount(el, target, dur){
  const start=performance.now();
  function step(now){
    const p=Math.min((now-start)/dur,1);
    el.textContent = Math.round(p*target);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- composer ---------- */
const fab=document.getElementById('fab'), scrim=document.getElementById('scrim'),
      sheet=document.getElementById('sheet'), postBtn=document.getElementById('post-btn'),
      cTitle=document.getElementById('c-title'), cBody=document.getElementById('c-body'),
      chips=document.getElementById('c-chips');
let selCat=null;

function openSheet(){ scrim.classList.add('open'); sheet.classList.add('open'); }
function closeSheet(){ scrim.classList.remove('open'); sheet.classList.remove('open'); }
fab.addEventListener('click', openSheet);
scrim.addEventListener('click', closeSheet);

chips.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{
    chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
    ch.classList.add('sel'); selCat=ch.dataset.cat; validate();
  });
});
[cTitle,cBody].forEach(el=>el.addEventListener('input', validate));
function validate(){
  postBtn.disabled = !(cTitle.value.trim() && cBody.value.trim() && selCat);
}

postBtn.addEventListener('click', ()=>{
  const newId = Math.max(...agendas.map(a=>a.id)) + 1;
  agendas.unshift({
    id:newId, cat:selCat, title:cTitle.value.trim(), body:cBody.value.trim(),
    votes:{poster:0,other:0,both:0}, comments:[]
  });
  render();
  closeSheet();
  cTitle.value=''; cBody.value=''; selCat=null;
  chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  postBtn.disabled=true;
  feed.scrollTo({top:0, behavior:'smooth'});
  toast('판결대에 올라갔어요 ⚖️ 링크를 공유해 표를 모아보세요');
});

/* ---------- scroll-to-top fab ---------- */
const fabTop = document.getElementById('fab-top');
let lastScrollY = 0;
feed.addEventListener('scroll', ()=>{
  const y = feed.scrollTop;
  if(y < lastScrollY && y > 100){
    fabTop.classList.add('visible');
    fab.classList.add('shifted');
  } else {
    fabTop.classList.remove('visible');
    fab.classList.remove('shifted');
  }
  lastScrollY = y;
});
fabTop.addEventListener('click', ()=>{ feed.scrollTo({top:0, behavior:'smooth'}); });

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2600);
}

render();
</script>
